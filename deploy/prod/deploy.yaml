engine: ssh

ssh:
  host: 91.99.88.180
  user: root
  password: file:../secrets/ssh-password
  layout: flat
  target_dir: /app

release:
  name: coco-iam
  version: 0.0.1

artifacts:
  - name: backend-binary
    type: binary
    source: ../../versions/coco-iam-deploy
    target: /app/coco-iam-api/coco-iam-api
    mode: "0755"
    pre_deploy: systemctl stop coco-iam
    post_deploy: systemctl start coco-iam

  # The geoip-updater is a second, independent executable (see
  # plan/geoip-enrichment/plan.md) — not managed by systemd, so there's
  # no service to stop/start around it. `pre_deploy` here is a no-op
  # shell command that exists only to make the ssh engine's
  # rm-then-upload path fire (engine.go: it unlinks the old file before
  # uploading a new one whenever pre_deploy is non-empty). That matters
  # because the geoip-updater may be actively running when a deploy
  # happens: unlinking leaves its already-open binary file intact under
  # the old (now nameless) inode, so the running process is unaffected
  # and only a future exec (i.e. the next Start()) picks up the new
  # binary. Without this, uploads would truncate-in-place via SFTP,
  # which would corrupt a running instance's mapped executable.
  - name: geoipupdater-binary
    type: binary
    source: ../../versions/geoipupdater-deploy
    target: /app/coco-iam-api/versions/geoipupdater
    mode: "0755"
    pre_deploy: "true"

  - name: frontend-bundle
    type: directory
    source: ../../app/dist
    target: /app/coco-iam-front

  - name: config
    type: directory
    source: ../../api/config
    target: /app/coco-iam-api/config

processes:
  - name: coco-iam
    restart: stop-start

env:
  COCO_IAM_PUBLIC_BASE_URL: https://coco-iam.t-digi.com
  COCO_IAM_CONFIG_DIR: /app/coco-iam-api/config
  COCO_IAM_LOG_LEVEL: info
  OBSERVE_AGGREGATOR_URL: https://coco-iam-api.t-digi.com/api/v1/admin/observe/push

health_check:
  url: https://coco-iam.t-digi.com
  expect_status: 200
  timeout: 60s
  interval: 2s

hooks:
  pre_deploy:
  post_deploy:
    - echo "coco-iam deployed to $COCO_IAM_PUBLIC_BASE_URL"

remote_hooks:
  pre_deploy:
  post_deploy:

# Each entry is inserted into /etc/caddy/Caddyfile exactly once, on
# whichever deploy first finds its block_id missing, and never
# touched again afterward — even if this block's text changes here in
# a later edit (see plugins/coco-deploy's caddy package and
# plan/coco-deploy-caddy-driver/plan.md's "Explicit tradeoff"
# section). Replaces the old blind `systemctl restart caddy`
# post-deploy hook above (now empty) — reload, not restart, so this
# is also a zero-downtime improvement over the old behavior.
#
# remote_path assumes Caddy's default /etc/caddy/Caddyfile on the
# production host — this has NOT been verified against the real host
# (91.99.88.180) and MUST be confirmed before this is ever actually
# deployed; if the real file lives elsewhere, these blocks would be
# written to the wrong place and never take effect.
caddy:
  - remote_path: /etc/caddy/Caddyfile
    block_id: coco-iam-api
    block: |
      coco-iam-api.t-digi.com {
          @cors_preflight {
              method OPTIONS
          }
          request_body {
              max_size 10MB
          }

          reverse_proxy 0.0.0.0:2026 {
              transport http {
                  read_timeout 360s
              }

              header_down -Access-Control-Allow-Origin
          }

          @options {
              method OPTIONS
          }

          header {
              Access-Control-Allow-Origin *
              Access-Control-Allow-Credentials true
              Access-Control-Allow-Methods *
              Access-Control-Allow-Headers *
              defer
          }
      }

  - remote_path: /etc/caddy/Caddyfile
    block_id: coco-iam-frontend
    block: |
      coco-iam.t-digi.com {
          root * /app/coco-iam-front
          file_server
          try_files {path} /index.html
      }
