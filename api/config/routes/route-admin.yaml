            scopes:
              - admin:dashboard:recent_users:read
              - super:admin
          - path: /dashboard/failed-tasks
            method: GET
            executor: AdminDashboardFailedTasksHandler
            security: authenticated
            scopes:
              - admin:dashboard:failed_tasks:read
              - super:admin
          - path: /oauth/authenticate
            method: POST
            executor: AdminLoginHandler
            security: public
          # Exchanges the pending mfa_token (system:mfa_required) minted
          # by /oauth/authenticate for a full token — see
          # plan/admin-mfa-totp/plan.md. Deliberately NOT under
          # /users/me and NOT scoped admin:me: that scope's "any
          # authenticated admin" bypass in ScopeSecurityLayer must
          # never apply here.
          - path: /oauth/verify-mfa
            method: POST
            executor: VerifyMfaHandler
            security: authenticated
            scopes:
              - system:mfa_required
          - path: /oauth/renew
            method: POST
            executor: TokenRenewHandler
            security: public
          - path: /acl/scopes
            method: GET
            executor: AclScopesHandler
            security: authenticated
            scopes:
              - admin:acl:read
              - admin:acl
          - path: /{res:users}
            method: GET
            executor: ApiResourceHandler
            filters:
              - isActive: true
            security: authenticated
            scopes:
              - admin:users:read
          - path: /{res:users}
            method: POST
            executor: ApiResourceHandler
            filters:
              - isActive: true
            security: authenticated
            scopes:
              - super:admin
          - path: /{res:users}
