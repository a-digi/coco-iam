            security: authenticated
            scopes:
              - super:admin
          - path: /{res:users}
            method: PATCH
            executor: ApiResourceHandler
            security: authenticated
            scopes:
              - super:admin
          - path: /{res:users}
            method: PUT
            executor: ApiResourceHandler
            security: authenticated
            scopes:
              - super:admin
          - path: /{res:users}/{id}
            method: GET
            executor: ApiResourceHandler
            security: authenticated
            scopes:
              - admin:users:read
          - path: /{res:users}/{id}
            method: POST
            executor: ApiResourceHandler
            security: authenticated
            scopes:
