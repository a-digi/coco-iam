routes:
  - path: /api/v1/
    content_type: application/json
    security: authenticated
    children:
      - path: admin
        content_type: application/json
        security: authenticated
        scopes:
          - super:admin
        children:
          - path: /dashboard/stats
            method: GET
            executor: AdminDashboardStatsHandler
            security: authenticated
            scopes:
              - admin:dashboard:stats:read
              - super:admin
          - path: /dashboard/registrations
            method: GET
            executor: AdminDashboardRegistrationsHandler
            security: authenticated
            scopes:
              - admin:dashboard:registrations:read
              - super:admin
          - path: /dashboard/top-orgs
            method: GET
            executor: AdminDashboardTopOrgsHandler
            security: authenticated
            scopes:
              - admin:dashboard:top_orgs:read
              - super:admin
          - path: /dashboard/queue
            method: GET
            executor: AdminDashboardQueueHandler
            security: authenticated
            scopes:
              - admin:dashboard:queue:read
              - super:admin
          - path: /dashboard/recent-users
            method: GET
            executor: AdminDashboardRecentUsersHandler
