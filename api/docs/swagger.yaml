securityDefinitions:
  BearerAuth:
    description: Bearer <JWT token>. See the API description above — which JWT you
      need depends on which tag the operation carries.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Manage an application's own end-users (create, list, patch, soft-delete,
    set password). Requires that application's `users:*` scope.
  name: public-app-users
- description: Read or replace a single user's role assignment within an application.
    Requires that application's `acl:*` scope.
  name: public-app-user-acl
- description: Manage user groups scoped to an application (create, list, patch, soft-delete).
    Requires that application's `groups:*` scope.
  name: public-app-groups
- description: Add, remove, and list which users belong to an application's groups.
    Requires that application's `groups:*` scope.
  name: public-app-group-members
- description: Read or replace a group's role assignment within an application. Requires
    that application's `acl:*` scope.
  name: public-app-group-acl
- description: Manage an application's own scope catalog — the vocabulary of permissions
    it exposes to its users. Requires that application's `scopes:*` scope.
  name: public-app-scopes
- description: Self-service preferences for the currently authenticated application
    end-user (e.g. password-expiry notification settings).
  name: public-app-me
