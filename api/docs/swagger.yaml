      username:
        $ref: '#/definitions/userrules.UsernameRules'
    type: object
  userrules.UsernameRules:
    properties:
      max_length:
        type: integer
      min_length:
        type: integer
      regex:
        type: string
      reserved:
        items:
          type: string
        type: array
    type: object
info:
  contact: {}
paths:
  /:
    get:
      description: Returns a plain-text confirmation that the server is running.
      produces:
      - text/plain
      responses:
        "200":
          description: Server is running!
      summary: Health check
      tags:
      - system
  /{orgSlug}/{wsSlug}/{appSlug}/oauth/introspect:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Validates a token and returns its claims. Returns {active:false}
        for any invalid/expired token.
      parameters:
      - description: Client ID
        in: formData
        name: client_id
        required: true
        type: string
      - description: Client secret
        in: formData
        name: client_secret
        required: true
        type: string
      - description: Token to introspect
        in: formData
        name: token
        required: true
        type: string
      - description: 'Hint: access_token or refresh_token'
        in: formData
        name: token_type_hint
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oauthserver.IntrospectionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/entity.OAuthErrorResponse'
      summary: OAuth introspect endpoint
      tags:
      - oauth
  /{orgSlug}/{wsSlug}/{appSlug}/oauth/revoke:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Revokes a token. Returns 200 regardless of whether the token existed
        (per RFC 7009).
      parameters:
      - description: Client ID
        in: formData
        name: client_id
        required: true
        type: string
      - description: Client secret
        in: formData
        name: client_secret
        type: string
      - description: Token to revoke
        in: formData
        name: token
        required: true
        type: string
      - description: 'Hint: access_token or refresh_token'
        in: formData
        name: token_type_hint
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/entity.OAuthErrorResponse'
      summary: OAuth revoke endpoint
      tags:
      - oauth
  /{orgSlug}/{wsSlug}/{appSlug}/oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Issues an access token. Supports authorization_code (with PKCE)
        and refresh_token grants.
      parameters:
      - description: 'Grant type: authorization_code or refresh_token'
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Client ID
        in: formData
        name: client_id
        required: true
        type: string
      - description: Client secret
        in: formData
        name: client_secret
        type: string
      - description: Authorization code (authorization_code grant)
        in: formData
        name: code
        type: string
      - description: PKCE code verifier (authorization_code grant)
        in: formData
        name: code_verifier
        type: string
      - description: Redirect URI (authorization_code grant)
        in: formData
        name: redirect_uri
        type: string
      - description: Refresh token (refresh_token grant)
        in: formData
        name: refresh_token
        type: string
      - description: Scope (optional narrowing on refresh)
        in: formData
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oauthserver.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/entity.OAuthErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/entity.OAuthErrorResponse'
      summary: OAuth token endpoint
      tags:
      - oauth
  /{orgSlug}/{wsSlug}/{appSlug}/oauth/userinfo:
    get:
      description: Returns OIDC user claims for the access token bearer. Supports
        GET and POST per the OIDC spec.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/entity.OAuthErrorResponse'
      security:
      - BearerAuth: []
      summary: OAuth userinfo endpoint
      tags:
      - oauth
    post:
      description: Returns OIDC user claims for the access token bearer. Supports
        GET and POST per the OIDC spec.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/entity.OAuthErrorResponse'
      security:
      - BearerAuth: []
      summary: OAuth userinfo endpoint
      tags:
      - oauth
  /a/{orgSlug}/{wsSlug}/{appSlug}/.well-known/openid-configuration:
    get:
      description: Returns the OIDC discovery metadata for the application. Standard
        .well-known/openid-configuration endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/oauthserver.DiscoveryMetadata'
      summary: OpenID Connect discovery document
      tags:
      - oauth
  /a/{orgSlug}/{wsSlug}/{appSlug}/oauth/authorize:
    get:
      description: Initiates the OAuth2 authorization code flow. Redirects to login
        or consent screen. GET and POST both accepted.
      parameters:
      - description: Client ID
        in: query
        name: client_id
        required: true
        type: string
      - description: Redirect URI
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: Must be 'code'
        in: query
        name: response_type
        required: true
        type: string
      - description: Requested scopes
        in: query
        name: scope
        type: string
      - description: State parameter
        in: query
        name: state
        type: string
      - description: PKCE code challenge
        in: query
        name: code_challenge
        type: string
      - description: PKCE method (S256)
        in: query
        name: code_challenge_method
        type: string
      responses:
        "302":
          description: Redirect to login or consent page
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: OAuth authorize endpoint
      tags:
      - oauth
    post:
      description: Initiates the OAuth2 authorization code flow. Redirects to login
        or consent screen. GET and POST both accepted.
