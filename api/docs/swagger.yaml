  /admin/oauth/authenticate:
    post:
      consumes:
      - application/json
      description: Authenticates an admin user with username+password and returns
        a signed JWT. If the admin has MFA enabled, returns 202 with a short-lived
        mfa_token (scope system:mfa_required) instead — exchange it at /admin/oauth/verify-mfa
        for the full token.
      parameters:
      - description: Username and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entity.LoginCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.LoginSuccess'
        "202":
          description: MFA enabled — verify to complete login
          schema:
            $ref: '#/definitions/entity.MfaRequiredSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Admin login
      tags:
      - auth
  /admin/oauth/renew:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Renew OAuth token
      tags:
      - auth
  /admin/oauth/verify-mfa:
    post:
      consumes:
      - application/json
      description: Exchanges a pending mfa_token (scope system:mfa_required, minted
        by /admin/oauth/authenticate) plus a valid TOTP code or unused recovery code
        for a full-scope access token.
      parameters:
      - description: 6-digit code, or an unused recovery code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entity.MfaCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.LoginSuccess'
        "400":
          description: invalid code
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: missing/invalid/expired mfa_token
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: no scopes assigned to this account
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "429":
          description: too many failed attempts — temporarily locked out
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Verify TOTP code and complete login
      tags:
      - auth
