    type: object
  entity.UpdateUserRequest:
    properties:
      email:
        example: new@example.com
        type: string
      is_active:
        example: true
        type: boolean
      is_super_admin:
        example: false
        type: boolean
      old_password:
        example: OldPass1!
        type: string
      password:
        example: NewPass1!
        type: string
    type: object
  entity.UserSuccess:
    properties:
      message:
        $ref: '#/definitions/github_com_a-digi_coco-iam_src_admin_users_entity.User'
      success:
