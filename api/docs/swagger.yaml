      email:
        type: string
      id:
        type: string
      is_active:
        default: true
        type: boolean
      is_super_admin:
        default: false
        type: boolean
      username:
        type: string
    type: object
  github_com_a-digi_coco-iam_src_organizations_users_entity.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        default: true
        type: boolean
      organization_id:
        type: string
      username:
        type: string
    type: object
  model.TokenResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/model.UserInfo'
    type: object
  model.UserInfo:
    properties:
      id:
        type: string
    type: object
  oauthserver.DiscoveryMetadata:
    properties:
      authorization_endpoint:
        type: string
      claims_supported:
        items:
          type: string
        type: array
      code_challenge_methods_supported:
        items:
          type: string
        type: array
      grant_types_supported:
        items:
          type: string
        type: array
      id_token_signing_alg_values_supported:
        items:
          type: string
        type: array
      introspection_endpoint:
        type: string
      issuer:
        type: string
      jwks_uri:
        type: string
      response_types_supported:
        items:
          type: string
        type: array
      revocation_endpoint:
        type: string
      scopes_supported:
        items:
          type: string
        type: array
      subject_types_supported:
        items:
          type: string
        type: array
      token_endpoint:
        type: string
      token_endpoint_auth_methods_supported:
        items:
          type: string
        type: array
