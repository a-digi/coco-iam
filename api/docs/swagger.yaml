paths:
  /admin/organization_users:
    get:
      description: Returns a list of users for the given organization (requires organization_id
        filter) or a single user by ID.
      parameters:
      - description: Organization ID filter (list lookup)
        in: query
        name: filter[@exact:organization_id]
        type: string
      - description: Page size (max 500, default 50)
        in: query
        name: limit
        type: integer
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.OrgUserListSuccess'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - BearerAuth: []
      summary: List or get organization users
      tags:
      - org-users
    post:
      consumes:
      - application/json
      description: Creates a pending org user and sends an activation email. No password
        on the wire.
      parameters:
      - description: User payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/entity.CreateOrgUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
