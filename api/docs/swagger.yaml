      max_length:
        type: integer
      min_length:
        type: integer
      notify_days:
        items:
          type: integer
        type: array
      require_digit:
        type: boolean
      require_lower:
        type: boolean
      require_special:
        type: boolean
      require_upper:
        type: boolean
    type: object
  userrules.RuleSet:
    properties:
      email:
        $ref: '#/definitions/userrules.EmailRules'
