definitions:
  activation_entity.ActivateRequest:
    properties:
      email:
        example: user@example.com
        type: string
      new_password:
        example: S3cr3tP@ss
        type: string
      token:
        example: abc123
        type: string
    type: object
  activation_entity.ActivateResponse:
    properties:
      redirect_url:
        example: /login
        type: string
      token:
        $ref: '#/definitions/model.TokenResponse'
    type: object
  activation_entity.ActivateSuccess:
    properties:
      message:
        $ref: '#/definitions/activation_entity.ActivateResponse'
      success:
        example: true
        type: boolean
    type: object
  activation_entity.ChangePasswordRequest:
    properties:
      new_password:
        example: NewS3cr3t!
        type: string
    type: object
  activation_entity.ChangePasswordResponse:
    properties:
      token:
        $ref: '#/definitions/model.TokenResponse'
    type: object
  activation_entity.ChangePasswordSuccess:
    properties:
      message:
        $ref: '#/definitions/activation_entity.ChangePasswordResponse'
      success:
        example: true
        type: boolean
    type: object
  activation_entity.VerifyRequest:
    properties:
      email:
        example: user@example.com
        type: string
      token:
        example: abc123
        type: string
    type: object
  activation_entity.VerifyResponse:
    properties:
      ok:
        example: true
        type: boolean
      rules:
        $ref: '#/definitions/userrules.RuleSet'
    type: object
  activation_entity.VerifySuccess:
    properties:
      message:
        $ref: '#/definitions/activation_entity.VerifyResponse'
      success:
        example: true
        type: boolean
    type: object
  entity.ActivationEcho:
    properties:
      expires_at:
        example: "2025-01-01T00:00:00Z"
        type: string
    type: object
  entity.Application:
    properties:
      allow_password_login:
        default: true
        description: |-
          AllowPasswordLogin toggles the username+password login endpoint
          for this app. Default true preserves legacy behaviour; an admin
          flips it off to force the OAuth-only path. Both the login
          handler and the public auth-methods endpoint honour this flag.
        type: boolean
      allow_recovery:
        default: true
        type: boolean
      allow_registration:
        default: false
        type: boolean
      client_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        default: true
        type: boolean
      registration_type:
        default: legacy
        description: |-
          RegistrationType declares how registration is collected:
            - "legacy": consumers render a form with username + password
              implicit and the admin-configured extras on top.
            - "oauth":  provider delivers identity; extras only.
          Only "legacy" is wired today; "oauth" is a declarative label
          we surface so the consumer can branch its UI ahead of the
          provider-flow implementation landing.
        type: string
      title:
        type: string
      workspace_id:
        type: string
    type: object
  entity.ApplicationRequest:
    properties:
      allow_password_login:
        type: boolean
      allow_recovery:
        type: boolean
      allow_registration:
        type: boolean
      client_id:
        example: my-app
        type: string
      description:
        example: App description
        type: string
      is_active:
        type: boolean
      registration_type:
        example: legacy
        type: string
      title:
        example: My Application
        type: string
      workspace_id:
        example: ws-uuid
        type: string
    type: object
  entity.ApplicationSuccess:
    properties:
      message:
        $ref: '#/definitions/entity.Application'
      success:
        example: true
        type: boolean
    type: object
  entity.CreateOrgUserRequest:
    properties:
      email:
        example: jdoe@example.com
        type: string
      is_active:
        example: true
        type: boolean
      organization_id:
        example: org-uuid
        type: string
      redirect_application_id:
        example: app-uuid
        type: string
      username:
        example: jdoe
        type: string
    type: object
  entity.CreateOrgUserResponse:
    properties:
      activation:
        $ref: '#/definitions/entity.OrgActivationEcho'
      activation_error:
        type: string
      user:
        $ref: '#/definitions/github_com_a-digi_coco-iam_src_organizations_users_entity.User'
    type: object
  entity.CreateOrgUserSuccess:
    properties:
      message:
        $ref: '#/definitions/entity.CreateOrgUserResponse'
      success:
        example: true
        type: boolean
    type: object
  entity.CreateUserRequest:
    properties:
      email:
        example: jdoe@example.com
        type: string
      is_active:
        example: true
        type: boolean
      is_super_admin:
        example: false
        type: boolean
      username:
        example: jdoe
        type: string
    type: object
  entity.CreateUserResponse:
    properties:
      activation:
        $ref: '#/definitions/entity.ActivationEcho'
      activation_error:
        type: string
      user:
        $ref: '#/definitions/github_com_a-digi_coco-iam_src_admin_users_entity.User'
    type: object
  entity.CreateUserSuccess:
    properties:
      message:
        $ref: '#/definitions/entity.CreateUserResponse'
      success:
        example: true
        type: boolean
    type: object
  entity.OAuthErrorResponse:
    properties:
      error:
        example: invalid_request
        type: string
      error_description:
        example: grant_type required
        type: string
    type: object
  entity.OrgActivationEcho:
    properties:
      expires_at:
        example: "2025-01-01T00:00:00Z"
        type: string
    type: object
  entity.OrgUserListSuccess:
    properties:
      message:
        items:
          $ref: '#/definitions/entity.OrgUserResponse'
        type: array
      success:
        example: true
        type: boolean
    type: object
  entity.OrgUserResponse:
    properties:
      activation_pending:
        example: false
        type: boolean
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        default: true
        type: boolean
      organization_id:
        type: string
      username:
        type: string
    type: object
  entity.OrgUserSuccess:
    properties:
      message:
        $ref: '#/definitions/entity.OrgUserResponse'
      success:
        example: true
        type: boolean
    type: object
  entity.PatchOrgUserRequest:
    properties:
      email:
        example: new@example.com
        type: string
      is_active:
        example: true
        type: boolean
    type: object
  entity.RegisterRequest:
    properties:
      fields:
        additionalProperties:
          type: string
        type: object
    type: object
  entity.RegisterSuccess:
    properties:
      message:
