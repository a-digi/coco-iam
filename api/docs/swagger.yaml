  profilefields.GetProfileFieldsResponse:
    properties:
      fields:
        items:
          $ref: '#/definitions/profilefields.ProfileFieldSchema'
        type: array
    type: object
  profilefields.ProfileFieldSchema:
    properties:
      data_type:
        type: string
      description:
        type: string
      id:
        type: string
      is_required:
        type: boolean
      label:
        type: string
      max_value:
        type: integer
      min_value:
        type: integer
      name:
        type: string
      options:
        items:
          type: string
        type: array
      order_index:
        type: integer
      regex:
        type: string
    type: object
  profilefields.PutProfileFieldsResponse:
    properties:
      fields:
        items:
          $ref: '#/definitions/userprofile.FieldWithValue'
        type: array
    type: object
  response.ErrorBody:
    properties:
      error:
        example: true
        type: boolean
      message:
        example: resource not found
        type: string
    type: object
  userprofile.FieldWithValue:
    properties:
      data_type:
        type: string
      description:
        type: string
      file_url:
        description: |-
          FileURL is the absolute serve URL for file-type fields that have a
          stored value. Empty for non-file fields and for file fields with no
          uploaded file. Populated by PopulateFileURLs after BuildResponse.
        type: string
      id:
        type: string
      is_required:
        type: boolean
      label:
        type: string
      max_value:
        type: integer
      min_value:
        type: integer
      name:
        type: string
      options:
        items:
          type: string
        type: array
      regex:
        type: string
      value:
        description: |-
          Value is the user's current value for this field, or null
          when the user hasn't filled it in. Type follows DataType:
          text → string, number → float64, date → string, select → string, etc.
    type: object
  userrules.EmailRules:
    properties:
      allowed_domains:
        items:
          type: string
        type: array
      blocked_domains:
        items:
          type: string
        type: array
    type: object
  userrules.PasswordRules:
    properties:
